; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nano_every

; Full-featured version with all patterns and animations
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
build_src_filter = +<*> -<main_minimal.cpp>
lib_deps = 
    hasenradball/DS3231-RTC@^1.1.0
	adafruit/Adafruit NeoPixel@^1.11.0
    arduino-libraries/Stepper@^1.1.3

; Minimal version - just time display and calibration
[env:nanoatmega328new_minimal]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
lib_deps = 
    hasenradball/DS3231-RTC@^1.1.0
	adafruit/Adafruit NeoPixel@^1.11.0
    arduino-libraries/Stepper@^1.1.3

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
lib_deps = 
    hasenradball/DS3231-RTC@^1.1.0
	adafruit/Adafruit NeoPixel@^1.11.0
    arduino-libraries/Stepper@^1.1.3

[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ~/Documents/Arduino/libraries
build_src_filter = +<*> -<main_minimal.cpp>
lib_deps = 
    hasenradball/DS3231-RTC@^1.1.0
	adafruit/Adafruit NeoPixel@^1.11.0
    arduino-libraries/Stepper@^1.1.3

; Minimal version for Nano Every - just time display and calibration
[env:nano_every_minimal]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ~/Documents/Arduino/libraries
